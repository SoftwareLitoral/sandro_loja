<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha conta | Loja do Sandro</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container-page py-10">
      <h1 class="text-3xl font-bold text-stone-900">Minha conta</h1>

      <div class="mt-8 grid gap-8 lg:grid-cols-[220px_1fr]">
        <!-- MENU -->
        <nav class="card h-fit p-3">
          <a href="#perfil" class="block rounded-xl px-3 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Dados pessoais</a>
          <a href="#enderecos" class="block rounded-xl px-3 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Enderecos</a>
          <a href="#senha" class="block rounded-xl px-3 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Alterar senha</a>
          <a href="/src/pages/pedidos.html" class="block rounded-xl px-3 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Meus pedidos</a>
        </nav>

        <div class="space-y-6">
          <!-- PERFIL -->
          <section id="perfil" class="card p-6">
            <h2 class="text-lg font-bold text-stone-900">Dados pessoais</h2>
            <form id="profile-form" class="mt-5 grid gap-4 sm:grid-cols-2">
              <div>
                <label class="label" for="name">Nome</label>
                <input class="input" id="name" name="name" required />
              </div>
              <div>
                <label class="label" for="email">E-mail</label>
                <input class="input" id="email" type="email" disabled />
              </div>
              <div>
                <label class="label" for="phone">Telefone</label>
                <input class="input" id="phone" name="phone" placeholder="(11) 90000-0000" />
              </div>
              <div class="flex items-end">
                <button type="submit" class="btn-primary">Salvar alteracoes</button>
              </div>
            </form>
          </section>

          <!-- ENDERECOS -->
          <section id="enderecos" class="card p-6">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-bold text-stone-900">Meus enderecos</h2>
              <button type="button" id="new-address-btn" class="text-sm font-semibold text-brand-600 hover:text-brand-700">
                + Novo endereco
              </button>
            </div>

            <div id="address-list" class="mt-5 space-y-3"></div>

            <form id="address-form" class="mt-5 hidden space-y-4 border-t border-stone-200 pt-5">
              <input type="hidden" id="address-id" />
              <div class="grid gap-4 sm:grid-cols-2">
                <div class="sm:col-span-2">
                  <label class="label" for="a-recipient">Nome do destinatario</label>
                  <input class="input" id="a-recipient" name="recipient" required />
                </div>
                <div>
                  <label class="label" for="a-street">Rua / Logradouro</label>
                  <input class="input" id="a-street" name="street" required />
                </div>
                <div>
                  <label class="label" for="a-number">Numero</label>
                  <input class="input" id="a-number" name="number" required />
                </div>
                <div>
                  <label class="label" for="a-complement">Complemento</label>
                  <input class="input" id="a-complement" name="complement" />
                </div>
                <div>
                  <label class="label" for="a-zipCode">CEP</label>
                  <input class="input" id="a-zipCode" name="zipCode" required maxlength="9" />
                </div>
                <div>
                  <label class="label" for="a-district">Bairro</label>
                  <input class="input" id="a-district" name="district" required />
                </div>
                <div>
                  <label class="label" for="a-city">Cidade</label>
                  <input class="input" id="a-city" name="city" required />
                </div>
                <div>
                  <label class="label" for="a-state">UF</label>
                  <input class="input" id="a-state" name="state" required maxlength="2" />
                </div>
                <div>
                  <label class="label" for="a-label">Apelido</label>
                  <input class="input" id="a-label" name="label" placeholder="Casa, Trabalho..." />
                </div>
              </div>
              <label class="flex items-center gap-2 text-sm text-stone-600">
                <input type="checkbox" id="a-isDefault" name="isDefault" class="h-4 w-4 rounded border-stone-300 text-brand-600 focus:ring-brand-500" />
                Definir como endereco padrao
              </label>
              <div class="flex gap-2">
                <button type="submit" class="btn-primary">Salvar endereco</button>
                <button type="button" id="cancel-address" class="btn-ghost">Cancelar</button>
              </div>
            </form>
          </section>

          <!-- SENHA -->
          <section id="senha" class="card p-6">
            <h2 class="text-lg font-bold text-stone-900">Alterar senha</h2>
            <form id="password-form" class="mt-5 grid max-w-md gap-4">
              <div>
                <label class="label" for="currentPassword">Senha atual</label>
                <input class="input" type="password" id="currentPassword" name="currentPassword" required />
              </div>
              <div>
                <label class="label" for="newPassword">Nova senha</label>
                <input class="input" type="password" id="newPassword" name="newPassword" required minlength="6" />
              </div>
              <button type="submit" class="btn-primary w-fit">Alterar senha</button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>
    <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/js/pages/conta.js"></script>
  </body>
</html>
