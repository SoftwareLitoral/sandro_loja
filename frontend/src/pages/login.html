<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Loja do Sandro</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container-page py-16">
      <div class="mx-auto max-w-md">
        <div class="card p-8">
          <h1 class="text-2xl font-bold text-stone-900">Entrar</h1>
          <p class="mt-1 text-sm text-stone-500">Acesse sua conta para acompanhar seus pedidos.</p>

          <form id="login-form" class="mt-6 space-y-4">
            <div>
              <label class="label" for="email">E-mail</label>
              <input class="input" type="email" id="email" name="email" required placeholder="voce@email.com" />
            </div>
            <div>
              <label class="label" for="password">Senha</label>
              <input class="input" type="password" id="password" name="password" required placeholder="••••••••" />
            </div>
            <p id="form-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600"></p>
            <button type="submit" class="btn-primary w-full">Entrar</button>
          </form>

          <p class="mt-6 text-center text-sm text-stone-500">
            Ainda nao tem conta?
            <a href="/src/pages/cadastro.html" class="font-semibold text-brand-600 hover:text-brand-700">Criar conta</a>
          </p>
        </div>

        <div class="mt-4 rounded-xl border border-dashed border-stone-300 bg-white p-4 text-center text-xs text-stone-500">
          Conta de teste: <span class="font-mono font-semibold">cliente@lojadosandro.com</span> /
          <span class="font-mono font-semibold">aluno</span>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>
    <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/js/pages/login.js"></script>
  </body>
</html>
