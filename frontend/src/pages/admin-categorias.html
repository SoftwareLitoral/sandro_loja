
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias | Loja do Sandro</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container-page py-16">
    <div class="mx-auto max-w-lg">
      <div class="card p-8">
        <h1 class="text-2xl font-bold text-stone-900">
          Cadastrar categoria
        </h1>
        <p class="mt-1 text-sm text-stone-500">
          Cadastre categorias para organizar seus produtos.
        </p>

        <form id="form-categoria" class="mt-6 space-y-4">
          <div>
            <label class="label" for="nome">Nome da categoria *</label>
            <input class="input" id="nome" name="name"
                   required minlength="2" maxlength="191"
                   placeholder="Ex.: Eletrônicos">
          </div>

          <div>
            <label class="label" for="descricao">Descrição</label>
            <textarea class="input" id="descricao" name="description"
                      maxlength="191"
                      placeholder="Descrição da categoria"></textarea>
          </div>

          <p id="mensagem" role="status"
             class="hidden rounded-lg px-3 py-2 text-sm"></p>

          <button type="submit" class="btn-primary w-full">
            Cadastrar categoria
          </button>
        </form>

        <hr class="my-6">

        <h2 class="text-lg font-semibold">Categorias cadastradas</h2>
        <ul id="lista-categorias" class="mt-3 space-y-2"></ul>

        <p class="mt-6 text-sm">
          <a href="/src/pages/admin-produtos.html">
            Voltar para produtos
          </a>
        </p>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="toast-root"
       class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script type="module" src="/src/js/pages/admin-categorias.js"></script>
</body>
</html>
