<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos | Loja do Sandro</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container-page py-10">
      <h1 class="text-3xl font-bold text-stone-900">Todos os produtos</h1>
      <p class="mt-2 text-stone-500">Encontre o proximo favorito.</p>

      <div class="mt-8 grid gap-8 lg:grid-cols-[260px_1fr]">
        <!-- FILTROS -->
        <aside class="card h-fit p-5 lg:sticky lg:top-24">
          <form id="filters" class="space-y-5">
            <div>
              <label class="label" for="search">Buscar</label>
              <input type="search" id="search" name="search" class="input" placeholder="Nome do produto" />
            </div>

            <div>
              <label class="label" for="category">Categoria</label>
              <select id="category" name="category" class="input">
                <option value="">Todas</option>
              </select>
            </div>

            <div>
              <span class="label">Preco</span>
              <div class="flex items-center gap-2">
                <input type="number" name="minPrice" min="0" step="0.01" class="input" placeholder="min" />
                <span class="text-stone-400">ate</span>
                <input type="number" name="maxPrice" min="0" step="0.01" class="input" placeholder="max" />
              </div>
            </div>

            <div>
              <label class="label" for="sort">Ordenar por</label>
              <select id="sort" name="sort" class="input">
                <option value="relevance">Mais recentes</option>
                <option value="price_asc">Menor preco</option>
                <option value="price_desc">Maior preco</option>
                <option value="name_asc">Nome (A-Z)</option>
                <option value="name_desc">Nome (Z-A)</option>
              </select>
            </div>

            <label class="flex items-center gap-2 text-sm text-stone-600">
              <input type="checkbox" name="featured" value="true" class="h-4 w-4 rounded border-stone-300 text-brand-600 focus:ring-brand-500" />
              Somente destaques
            </label>

            <button type="submit" class="btn-primary w-full">Aplicar filtros</button>
            <button type="reset" id="clear-filters" class="btn-ghost w-full">Limpar</button>
          </form>
        </aside>

        <!-- RESULTADOS -->
        <section>
          <div class="flex items-center justify-between">
            <p id="result-count" class="text-sm text-stone-500">Carregando...</p>
            <span id="active-filters" class="text-xs text-stone-400"></span>
          </div>
          <div id="products" class="mt-4 grid grid-cols-2 gap-5 md:grid-cols-3"></div>
          <div id="pagination" class="mt-10 flex items-center justify-center gap-2"></div>
        </section>
      </div>
    </main>

    <div id="app-footer"></div>
    <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/js/pages/produtos.js"></script>
  </body>
</html>
